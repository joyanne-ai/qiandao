<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>低碳行为打卡积分系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f9eb;
    font-family: "Microsoft YaHei", Arial, sans-serif;
    padding: 20px;
  }
  .container {
    max-width: 460px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }
  h1 {
    text-align: center;
    color: #2e7d32;
    margin-bottom: 18px;
    font-size: 22px;
  }
  .section { margin-bottom: 16px; }
  label {
    font-weight: bold;
    color: #333;
    display: block;
    margin-bottom: 8px;
  }
  select, button, input[type="file"] {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .score-box {
    background: #e8f5e9;
    padding: 12px;
    border-radius: 8px;
    margin: 14px 0;
    text-align: center;
  }
  .score-box .num {
    font-size: 24px;
    color: #2e7d32;
    font-weight: bold;
  }
  button {
    background: #2e7d32;
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }
  button.secondary { background: #348ede; }
  button.danger { background: #e57373; }
  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .log-box {
    margin-top: 16px;
    background: #f8fff8;
    padding: 12px;
    border-radius: 8px;
    max-height: 240px;
    overflow-y: auto;
  }
  .log-item {
    padding: 6px 0;
    border-bottom: 1px dashed #dcedc8;
    font-size: 14px;
  }
  .log-item img {
    max-width: 80px;
    margin-top:4px;
    border-radius:4px;
  }
  .hidden { display: none; }
  .admin-panel {
    margin-top: 20px;
    border-top: 2px solid #c8e6c9;
    padding-top: 16px;
  }
  .rank-panel {
    margin-top:20px;
    border-top:2px solid #c8e6c9;
    padding-top:16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    border: 1px solid #e0e0e0;
    padding: 8px;
    text-align: center;
  }
  th { background: #c8e6c9; }
  .tip {
    color:#666;
    font-size:13px;
    margin-top:4px;
  }
  .preview-img{
    max-width:120px;
    margin-top:8px;
    border-radius:6px;
  }
  .add-member-row{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .add-member-row input{
    flex:1;
    padding:8px;
    border:1px solid #ccc;
    border-radius:6px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🌱 低碳行为打卡积分系统</h1>

  <div class="section">
    <label>选择你的名字</label>
    <select id="memberSelect"></select>
  </div>

  <div class="section">
    <label>✅ 勾选本次低碳行为（可多选）</label>
    <div class="tip">同一行为每天只能打卡一次，防止重复刷分</div>
    <div id="actionList"></div>
  </div>

  <div class="section">
    <label>📷 上传打卡图片（必须上传）</label>
    <input type="file" id="imgUpload" accept="image/*">
    <div><img id="imgPreview" class="preview-img hidden" /></div>
  </div>

  <div class="score-box">
    <div>当前累计积分</div>
    <div class="num" id="totalScore">0</div>
  </div>

  <button id="submitBtn">📝 提交本次打卡</button>

  <div class="btn-group">
    <button class="secondary" id="refreshBtn">🔄 刷新记录</button>
    <button class="secondary" id="exportBtn">📤 导出个人记录</button>
  </div>

  <div class="log-box" id="logBox">加载中...</div>

  <div class="btn-group" style="margin-top:16px;">
    <button class="secondary" id="enterAdminBtn">🔐 进入管理后台</button>
    <button class="secondary" id="enterRankBtn">🏆 排行榜</button>
  </div>

  <!-- 管理后台 -->
  <div class="admin-panel hidden" id="adminPanel">
    <h3 style="margin-bottom:10px;">管理后台 - 全部成员积分</h3>
    <!-- 管理员专属：新增、删除成员 -->
    <div id="adminOperateArea" class="hidden">
      <div class="add-member-row">
        <input type="text" id="newMemberName" placeholder="输入新成员姓名">
        <button class="secondary" id="addMemberBtn">新增成员</button>
      </div>
      <button class="danger" id="delMemberBtn" style="margin-bottom:10px;">删除选中成员</button>
    </div>
    <button class="secondary" id="exportAllBtn" style="margin-bottom:10px;">📤 导出全部记录</button>
    <table id="adminTable">
      <thead>
        <tr>
          <th class="admin-checkbox-col hidden">选择</th>
          <th>排名</th>
          <th>姓名</th>
          <th>总积分</th>
          <th>打卡次数</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 独立排行榜（免密码，所有人可见） -->
  <div class="rank-panel hidden" id="rankPanel">
    <h3 style="text-align:center; margin-bottom:10px;">🏆 低碳积分排行榜</h3>
    <table id="rankTable">
      <thead>
        <tr>
          <th>排名</th>
          <th>姓名</th>
          <th>总积分</th>
          <th>打卡次数</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
  // ===================== 配置区 =====================
  const SUPABASE_URL = "https://mewxngckvlmqeacmzsns.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_FFjkHVfrdyc-gAB6pA9ubA_Q2AA-3sI";
  const ADMIN_PASSWORD = "admin123";
  const BUCKET_NAME = "checkin-images";
  // =================================================

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const actions = [
    { name: "步行出行", score: 2 },
    { name: "骑行", score: 3 },
    { name: "公交/地铁", score: 3 },
    { name: "拼车出行", score: 2 },
    { name: "自带水杯/购物袋", score: 1 },
    { name: "光盘行动", score: 2 },
    { name: "无纸化学习", score: 1 },
    { name: "节约用水", score: 1 },
    { name: "节约用电", score: 1 },
    { name: "垃圾分类", score: 1 },
    { name: "二手循环利用", score: 2 },
    { name: "植树/线上植树", score: 3 },
    { name: "低碳饮食", score: 1 }
  ];

  const memberSelect = document.getElementById("memberSelect");
  const actionList = document.getElementById("actionList");
  const totalScoreDom = document.getElementById("totalScore");
  const logBox = document.getElementById("logBox");
  const adminPanel = document.getElementById("adminPanel");
  const adminTable = document.querySelector("#adminTable tbody");
  const rankPanel = document.getElementById("rankPanel");
  const rankTable = document.querySelector("#rankTable tbody");
  const imgUpload = document.getElementById("imgUpload");
  const imgPreview = document.getElementById("imgPreview");
  const adminOperateArea = document.getElementById("adminOperateArea");
  const adminCheckboxCol = document.querySelector(".admin-checkbox-col");

  let selectedFile = null;

  // 图片预览
  imgUpload.onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = ev => {
      imgPreview.src = ev.target.result;
      imgPreview.classList.remove("hidden");
    }
    reader.readAsDataURL(file);
  }

  // 日期辅助：获取当天0点、24点
  function getTodayRange() {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const end = new Date(start);
    end.setDate(end.getDate() + 1);
    return { start, end };
  }
  function formatTime(str) {
    return new Date(str).toLocaleString("zh-CN");
  }

  // 加载成员
  async function loadMembers() {
    const { data, error } = await supabaseClient.from("members").select("*").order("name");
    if(error) {
      logBox.innerHTML = "成员加载失败：" + error.message;
      return;
    }
    memberSelect.innerHTML = "";
    data.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.textContent = m.name;
      memberSelect.appendChild(opt);
    });
    loadPersonalRecords();
  }

  // 加载行为列表
  function loadActions() {
    actionList.innerHTML = "";
    actions.forEach((a, i) => {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <input type="checkbox" id="action${i}" data-name="${a.name}" data-score="${a.score}">
        <label for="action${i}">${a.name}（${a.score}分）</label>
      `;
      actionList.appendChild(div);
    });
  }

  // 加载个人记录（展示图片）
  async function loadPersonalRecords() {
    const memberId = memberSelect.value;
    if (!memberId) return;

    const { data, error } = await supabaseClient
      .from("checkins")
      .select("action, score, created_at, image_url")
      .eq("member_id", memberId)
      .order("created_at", { ascending: false });

    if(error) {
      logBox.innerHTML = "记录加载失败：" + error.message;
      return;
    }

    const total = data.reduce((sum, item) => sum + item.score, 0);
    totalScoreDom.textContent = total;

    logBox.innerHTML = "📜 打卡日志：<br>";
    if(data.length === 0) {
      logBox.innerHTML += "<div class='log-item'>暂无打卡记录</div>";
      return;
    }
    data.forEach(item => {
      const time = formatTime(item.created_at);
      let html = `<div class="log-item">[${time}] ${item.action} +${item.score}分`;
      if(item.image_url) html += `<br><img src="${item.image_url}" alt="打卡图">`;
      html += "</div>";
      logBox.innerHTML += html;
    });
  }

  // 上传图片到storage
  async function uploadImage(file) {
    const ext = file.name.split(".").pop();
    const fileName = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const { data, error } = await supabaseClient.storage.from(BUCKET_NAME).upload(fileName, file);
    if(error) throw error;
    const { data: { publicUrl } } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(fileName);
    return publicUrl;
  }

  // 提交打卡
  document.getElementById("submitBtn").addEventListener("click", async () => {
    const memberId = memberSelect.value;
    const checkboxes = document.querySelectorAll("#actionList input:checked");

    if (checkboxes.length === 0) {
      alert("请至少勾选一项低碳行为！");
      return;
    }
    if(!selectedFile){
      alert("请上传打卡图片！");
      return;
    }

    const { start, end } = getTodayRange();
    const { data: todayCheck } = await supabaseClient
      .from("checkins")
      .select("action")
      .eq("member_id", memberId)
      .gte("created_at", start.toISOString())
      .lt("created_at", end.toISOString());

    const todayActions = todayCheck.map(x=>x.action);
    let insertList = [];
    for (const cb of checkboxes) {
      const actName = cb.dataset.name;
      if(todayActions.includes(actName)) {
        alert(`【${actName}】今天已经打卡过了，不能重复打卡！`);
        return;
      }
      insertList.push({
        member_id: memberId,
        action: actName,
        score: Number(cb.dataset.score)
      });
    }

    // 上传图片
    let imgUrl;
    try{
      imgUrl = await uploadImage(selectedFile);
    }catch(e){
      alert("图片上传失败："+e.message);
      return;
    }
    // 给所有本次打卡记录带上同一张图片
    insertList.forEach(row=>row.image_url = imgUrl);

    const { error } = await supabaseClient.from("checkins").insert(insertList);
    if(error) {
      alert("打卡失败："+error.message);
      return;
    }
    alert("✅ 打卡成功！积分已更新");
    // 重置
    checkboxes.forEach(cb=>cb.checked=false);
    imgUpload.value = "";
    imgPreview.classList.add("hidden");
    selectedFile = null;
    loadPersonalRecords();
    loadAdminTable();
    loadRankTable();
  });

  // 刷新
  document.getElementById("refreshBtn").addEventListener("click", () => {
    loadPersonalRecords();
    loadAdminTable();
    loadRankTable();
  });

  // 导出个人记录
  document.getElementById("exportBtn").addEventListener("click", async () => {
    const memberId = memberSelect.value;
    const memberName = memberSelect.options[memberSelect.selectedIndex].text;
    const { data } = await supabaseClient
      .from("checkins")
      .select("action, score, created_at, image_url")
      .eq("member_id", memberId)
      .order("created_at", { ascending: true });

    let csv = "时间,行为,积分,图片链接\n";
    data.forEach(item => {
      csv += `${formatTime(item.created_at)},${item.action},${item.score},${item.image_url||""}\n`;
    });
    const blob = new Blob(["\uFEFF"+csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${memberName}_低碳记录.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  // 进入管理后台（输入密码成功后，才显示增删成员控件）
  document.getElementById("enterAdminBtn").addEventListener("click", () => {
    const pwd = prompt("请输入管理密码：");
    if (pwd === ADMIN_PASSWORD) {
      adminPanel.classList.remove("hidden");
      rankPanel.classList.add("hidden");
      // 密码正确，开启管理员专属操作
      adminOperateArea.classList.remove("hidden");
      adminCheckboxCol.classList.remove("hidden");
      loadAdminTable(true);
    } else {
      alert("密码错误！");
    }
  });

  // 打开排行榜
  document.getElementById("enterRankBtn").addEventListener("click", ()=>{
    adminPanel.classList.add("hidden");
    rankPanel.classList.remove("hidden");
    loadRankTable();
  })

  // 新增成员
  document.getElementById("addMemberBtn").onclick = async ()=>{
    const name = document.getElementById("newMemberName").value.trim();
    if(!name){
      alert("请输入姓名");
      return;
    }
    const {error} = await supabaseClient.from("members").insert({name});
    if(error){
      alert("新增失败："+error.message);
    }else{
      alert("新增成功");
      document.getElementById("newMemberName").value="";
      loadMembers();
      loadAdminTable(true);
    }
  }

  // 删除选中成员
  document.getElementById("delMemberBtn").onclick = async ()=>{
    const chk = adminTable.querySelector("input:checked");
    if(!chk) { alert("请先勾选要删除的成员"); return; }
    if(!confirm("确定删除该成员？该成员所有打卡记录也会一起删除！")) return;
    const id = chk.value;
    // 先删打卡记录，再删成员
    await supabaseClient.from("checkins").delete().eq("member_id",id);
    const {error} = await supabaseClient.from("members").delete().eq("id",id);
    if(error) alert("删除失败："+error.message);
    else { alert("已删除"); loadMembers(); loadAdminTable(true); loadRankTable(); }
  }

  // 加载管理后台表格，isAdmin=true才渲染单选框
  async function loadAdminTable(isAdmin = false) {
    const { data } = await supabaseClient.from("members").select(`
      id,
      name,
      checkins(score, created_at)
    `);

    const stats = data.map(m => {
      const total = m.checkins.reduce((sum, c) => sum + (c.score || 0), 0);
      return { id:m.id, name: m.name, total, count: m.checkins.length };
    });
    stats.sort((a, b) => b.total - a.total);

    adminTable.innerHTML = "";
    stats.forEach((item, index) => {
      const tr = document.createElement("tr");
      if(isAdmin){
        tr.innerHTML = `
          <td><input type="radio" name="delMember" value="${item.id}"></td>
          <td>${index + 1}</td>
          <td>${item.name}</td>
          <td>${item.total}</td>
          <td>${item.count}</td>
        `;
      }else{
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.name}</td>
          <td>${item.total}</td>
          <td>${item.count}</td>
        `;
      }
      adminTable.appendChild(tr);
    });
  }

  // 加载排行榜
  async function loadRankTable() {
    const { data } = await supabaseClient.from("members").select(`
      id,
      name,
      checkins(score, created_at)
    `);
    const stats = data.map(m => {
      const total = m.checkins.reduce((sum, c) => sum + (c.score || 0), 0);
      return { name: m.name, total, count: m.checkins.length };
    });
    stats.sort((a, b) => b.total - a.total);
    rankTable.innerHTML = "";
    stats.forEach((item, index) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td>${item.name}</td>
        <td>${item.total}</td>
        <td>${item.count}</td>
      `;
      rankTable.appendChild(tr);
    });
  }

  // 导出全部记录
  document.getElementById("exportAllBtn").addEventListener("click", async () => {
    const { data: allCheckins } = await supabaseClient
      .from("checkins")
      .select("member_id, action, score, created_at, image_url")
      .order("created_at");

    const { data: allMembers } = await supabaseClient.from("members").select("id,name");
    const mapMember = {};
    allMembers.forEach(m=> mapMember[m.id] = m.name);

    let csv = "姓名,低碳行为,积分,时间,图片链接\n";
    allCheckins.forEach(item => {
      const name = mapMember[item.member_id] || "未知成员";
      csv += `${name},${item.action},${item.score},${formatTime(item.created_at)},${item.image_url||""}\n`;
    });
    const blob = new Blob(["\uFEFF"+csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "全部成员低碳记录.csv";
    a.click();
    URL.revokeObjectURL(url);
  });

  memberSelect.addEventListener("change", loadPersonalRecords);

  // 初始化
  loadMembers();
  loadActions();
</script>
</body>
</html>
